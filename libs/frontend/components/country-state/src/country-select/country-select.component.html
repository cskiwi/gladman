<p-select
  [options]="countries()"
  [ngModel]="value()"
  [ngModelOptions]="{ standalone: true }"
  (ngModelChange)="onValueChange($event)"
  [inputId]="inputId()"
  [ariaLabelledBy]="ariaLabelledBy()"
  optionLabel="name"
  optionValue="code"
  [filter]="true"
  [filterBy]="'name'"
  [placeholder]="'all.competition.edit.info.country.placeholder' | translate"
  [showClear]="true"
  [disabled]="disabled()"
  appendTo="body"
  fluid
/>
