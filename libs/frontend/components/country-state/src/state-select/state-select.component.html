<p-select
  [options]="states()"
  [ngModel]="value()"
  [ngModelOptions]="{ standalone: true }"
  (ngModelChange)="onValueChange($event)"
  [inputId]="inputId()"
  [ariaLabelledBy]="ariaLabelledBy()"
  optionLabel="name"
  optionValue="code"
  [filter]="true"
  [filterBy]="'name'"
  [placeholder]="'all.competition.edit.info.state.placeholder' | translate"
  [showClear]="true"
  [disabled]="disabled() || states().length === 0"
  appendTo="body"
  fluid
/>
