<header class="mb-6">
  <p-card class="border border-surface">
    <div class="flex flex-wrap items-center gap-4">
      <ng-content select="[avatar]" />
      <div class="min-w-0 flex-1 basis-48 break-words">
        <ng-content select="[identity]" />
      </div>
      <div class="w-full min-w-0 lg:w-auto lg:ml-auto *:flex-wrap [&:empty]:hidden">
        <ng-content select="[actions]" />
      </div>
    </div>
    <ng-content select="[stats]" />
    <ng-content />
  </p-card>
</header>
