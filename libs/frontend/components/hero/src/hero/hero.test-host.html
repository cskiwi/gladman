@switch (mode()) { @case ('hero') {
<app-hero>
  <app-hero-avatar avatar [variant]="variant()">AB</app-hero-avatar>
  <div identity>
    <app-hero-title>{{ title() }}</app-hero-title>
    <p data-testid="metadata">Club and season</p>
  </div>
  @if (extras()) {
  <div actions>
    <button pButton type="button" (click)="activate()">
      <span pButtonLabel>Follow</span>
    </button>
    <button pButton type="button">
      <span pButtonLabel>Compare players</span>
    </button>
  </div>
  <div stats data-testid="stats">Ranking statistics</div>
  }
  <p data-testid="default-content">Additional context</p>
</app-hero>
} @case ('page') {
<app-page-header>
  @if (extras()) {
  <i avatar class="pi pi-users" aria-hidden="true"></i>
  } @if (extras()) {
  <span subTitle data-testid="metadata">Player context</span>
  } @if (extras()) {
  <button pButton type="button" actions (click)="activate()">
    <span pButtonLabel>Edit player</span>
  </button>
  }
  <span title>{{ title() }}</span>
</app-page-header>
} @case ('section') {
<app-section-header [title]="title()">
  <span badge>3</span>
  <button pButton type="button" action (click)="activate()">
    <span pButtonLabel>View all</span>
  </button>
</app-section-header>
} @case ('breadcrumb') {
<app-breadcrumb [items]="[{ label: title() }]" />
} }
