<header class="flex flex-wrap items-center gap-4 mb-6">
  <div class="inline-flex shrink-0 text-primary [&:empty]:hidden">
    <ng-content select="[avatar]" />
  </div>
  <div class="min-w-0 flex-1 basis-48">
    <h1 class="m-0 text-3xl md:text-4xl font-semibold leading-tight tracking-tight text-color break-words">
      <ng-content select="[title]" />
    </h1>
    <div class="flex flex-wrap items-center gap-2 mt-2 text-sm text-muted-color [&:empty]:hidden">
      <ng-content select="[subTitle]" />
    </div>
  </div>
  <div class="flex flex-wrap items-center gap-2 w-full lg:w-auto lg:ml-auto [&:empty]:hidden">
    <ng-content select="[actions]" />
  </div>
</header>
