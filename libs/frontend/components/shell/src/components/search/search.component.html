<div class="w-full md:w-80 lg:w-96 max-w-full mx-auto">
  <p-autocomplete
    [(ngModel)]="searchValue"
    [suggestions]="results()"
    (completeMethod)="onSearch($event)"
    (onSelect)="onSelect($event)"
    [optionLabel]="'title'"
    [placeholder]="'all.search.placeholder' | translate"
    [attr.aria-label]="'all.search.placeholder' | translate"
    [dropdown]="false"
    [multiple]="false"
    [minQueryLength]="2"
    styleClass="w-full"
  >
    <ng-template let-item #item>
      <div class="flex items-center gap-3">
        <!-- Icon based on linkType -->
        <i [class]="getIconClass(item.linkType)" class="text-lg text-primary" aria-hidden="true"></i>

        <!-- Content -->
        <div class="flex flex-col flex-1">
          <div class="font-medium text-color">
            {{ item.title }}
          </div>
          <div class="text-sm text-muted-color">
            <!-- Show subtitle (e.g., club name) if available, otherwise show type label -->
            {{ item.subtitle || (getTypeLabel(item.linkType) | translate) }}
          </div>
        </div>
      </div>
    </ng-template>

    <ng-template #header>
      <div class="font-medium px-3 py-2">
        <div class="flex items-center gap-2">
          <span>{{ 'all.search.results' | translate }}</span>
          @if (loading()) {
            <i class="pi pi-spin pi-spinner text-sm"></i>
          }
        </div>
      </div>
    </ng-template>

    <ng-template #empty>
      <div class="px-3 py-2 text-muted-color text-center">
        @if (loading()) {
          <div class="flex items-center justify-center gap-2">
            <i class="pi pi-spin pi-spinner"></i>
            <span>{{ 'all.search.loading' | translate }}</span>
          </div>
        } @else {
          <span>{{ 'all.search.noResults' | translate }}</span>
        }
      </div>
    </ng-template>
  </p-autocomplete>
</div>
