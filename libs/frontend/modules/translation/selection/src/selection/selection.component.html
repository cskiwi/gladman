<button pButton type="button" [text]="true" (click)="menuRef.toggle($event)" #menuButton>
  <i pButtonIcon class="pi pi-globe" aria-hidden="true"></i>
  <span pButtonLabel>{{ 'all.settings.languages.' + this.current | translate }}</span>
</button>

<p-menu #menuRef [model]="menuItems" [popup]="true"></p-menu>
