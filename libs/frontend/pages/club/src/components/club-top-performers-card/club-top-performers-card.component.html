<p-card [header]="'all.club.detail.sidebar.topPerformers.title' | translate">
  @if (loading()) {
    <p-progressbar mode="indeterminate" />
  } @else if (rows().length > 0) {
    <ol class="m-0 flex list-none flex-col gap-3 p-0">
      @for (p of rows(); track p.id) {
        <li class="flex items-center gap-3">
          <div class="flex min-w-0 flex-1 flex-col">
            <a class="truncate font-semibold text-color no-underline hover:underline" [routerLink]="['/players', p.slug]">
              {{ p.fullName }}
            </a>
            <span class="text-sm tabular-nums text-muted-color">{{ p.wins }}–{{ p.losses }}</span>
          </div>
          <p-tag [severity]="p.winRatePct >= 50 ? 'success' : 'danger'" [value]="p.winRatePct + '%'" />
        </li>
      }
    </ol>
  } @else {
    <p class="m-0 text-muted-color">{{ 'all.club.detail.sidebar.topPerformers.empty' | translate }}</p>
  }
</p-card>
