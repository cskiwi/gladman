<p-fluid>
  <div class="flex flex-col gap-4">
    <div class="flex flex-wrap items-center justify-between gap-2">
      <span class="font-semibold break-words min-w-0">{{ player.fullName }}</span>
      <span class="text-sm text-muted-color" role="img" [attr.aria-label]="'all.ranking.summary' | translate: ranking()">
        {{ ranking().single }} - {{ ranking().double }} - {{ ranking().mix }}
      </span>
    </div>

    <div class="flex items-center gap-2">
      <p-checkbox [(ngModel)]="stoppingCompetition" [binary]="true" inputId="survey-stopping" />
      <label for="survey-stopping">{{ 'all.club.teamBuilder.player.stopping' | translate }}</label>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div class="flex flex-col gap-2">
        <label for="survey-team-count">{{ 'all.player.survey.teamsWanted' | translate }}</label>
        <p-inputnumber inputId="survey-team-count" [(ngModel)]="desiredTeamCount" [min]="0" [showButtons]="true" />
      </div>
      <div class="flex flex-col gap-2">
        <label for="survey-play-day">{{ 'all.team.preferred-day' | translate }}</label>
        <input id="survey-play-day" type="text" pInputText [(ngModel)]="preferredPlayDay" />
      </div>
    </div>

    @for (team of teamPreferences; track team.number) {
      <p-panel [header]="'all.team.numbered' | translate: { number: team.number }">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div class="flex flex-col gap-2">
            <label [for]="'survey-' + team.firstChoice">{{ 'all.player.survey.firstChoice' | translate }}</label>
            <input [id]="'survey-' + team.firstChoice" type="text" pInputText [(ngModel)]="this[team.firstChoice]" />
          </div>
          <div class="flex flex-col gap-2">
            <label [for]="'survey-' + team.secondChoice">{{ 'all.player.survey.secondChoice' | translate }}</label>
            <input [id]="'survey-' + team.secondChoice" type="text" pInputText [(ngModel)]="this[team.secondChoice]" />
          </div>
          <div class="flex flex-col gap-2">
            <label [for]="'survey-' + team.availability">{{ 'all.player.survey.canMeet75' | translate }}</label>
            <input [id]="'survey-' + team.availability" type="text" pInputText [(ngModel)]="this[team.availability]" />
          </div>
          <div class="flex flex-col gap-2">
            <label [for]="'survey-' + team.unavailability">{{ 'all.player.survey.unavailability' | translate }}</label>
            <input [id]="'survey-' + team.unavailability" type="text" pInputText [(ngModel)]="this[team.unavailability]" />
          </div>
        </div>
      </p-panel>
    }

    <div class="flex flex-col gap-2">
      <label for="survey-comments">{{ 'all.common.remarks' | translate }}</label>
      <textarea id="survey-comments" pTextarea [(ngModel)]="comments" [rows]="3" [autoResize]="true"></textarea>
    </div>

    <div class="flex flex-wrap justify-end gap-2">
      <p-button [label]="'all.button.cancel' | translate" severity="secondary" [fluid]="false" (onClick)="cancel()" />
      <p-button [label]="'all.button.save' | translate" icon="pi pi-check" [fluid]="false" (onClick)="save()" />
    </div>
  </div>
</p-fluid>
