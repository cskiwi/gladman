<div class="mb-4 flex flex-wrap items-center justify-between gap-3">
  <span id="club-team-count" class="text-muted-color">
    {{ countKey() | translate: { count: counts().all } }}
  </span>

  <p-selectbutton
    class="flex-wrap"
    size="small"
    [options]="options()"
    [ngModel]="filter()"
    (ngModelChange)="select($event)"
    optionValue="value"
    [allowEmpty]="false"
    ariaLabelledBy="club-team-count"
  >
    <ng-template #item let-option>
      <span>{{ 'all.club.detail.teams.filter.' + option.key | translate }} · {{ option.count }}</span>
    </ng-template>
  </p-selectbutton>
</div>
