<!-- Breadcrumb -->
<app-breadcrumb [items]="[{ label: ('all.competition.team-assembly.title' | translate) }]" />

<!-- Header -->
<header class="mb-6">
  <h1 class="text-2xl font-semibold m-0">{{ 'all.competition.team-assembly.title' | translate }}</h1>
</header>

<!-- Filters -->
<p-card class="block mb-6">
  <div class="flex flex-col gap-4">
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-4">
      <div class="flex flex-col gap-2 min-w-0">
        <label for="season-select">{{ 'all.competition.team-assembly.season' | translate }}</label>
        <p-select
          [options]="seasonOptions()"
          [ngModel]="selectedSeason()"
          (ngModelChange)="onSeasonChange($event)"
          optionLabel="label"
          optionValue="value"
          inputId="season-select"
          [fluid]="true"
          [ariaLabel]="'all.competition.team-assembly.season' | translate"
        />
      </div>

      <div class="flex flex-col gap-2 min-w-0">
        <label for="club-select">{{ 'all.competition.team-assembly.club' | translate }}</label>
        <p-autocomplete
          [suggestions]="clubSuggestions()"
          (completeMethod)="searchClub($event)"
          (onSelect)="onClubSelect($event.value)"
          (onClear)="onClubClear()"
          optionLabel="name"
          [forceSelection]="true"
          [ngModel]="selectedClub()"
          inputId="club-select"
          [fluid]="true"
        />
      </div>

      <div class="flex flex-col gap-2 min-w-0">
        <label for="team-select">{{ 'all.competition.team-assembly.team' | translate }}</label>
        <p-select
          [options]="teams()"
          [ngModel]="selectedTeamId()"
          (ngModelChange)="onTeamChange($event)"
          optionLabel="name"
          optionValue="id"
          [optionGroupLabel]="'type'"
          [optionGroupChildren]="'teams'"
          [group]="true"
          [disabled]="!selectedClub()"
          inputId="team-select"
          [fluid]="true"
          [ariaLabel]="'all.competition.team-assembly.team' | translate"
        />
      </div>

      <div class="flex flex-col gap-2 min-w-0">
        <label for="encounter-select">{{ 'all.competition.team-assembly.encounter' | translate }}</label>
        <p-select
          [options]="encounters()"
          [ngModel]="selectedEncounterId()"
          (ngModelChange)="onEncounterChange($event)"
          optionLabel="label"
          optionValue="id"
          [showClear]="true"
          [disabled]="!selectedTeamId()"
          inputId="encounter-select"
          [fluid]="true"
          [ariaLabel]="'all.competition.team-assembly.encounter' | translate"
        />
      </div>
    </div>
    <div class="flex flex-wrap gap-2">
      <button pButton type="button" size="small" [disabled]="pdfLoading()" (click)="download()" severity="secondary" [outlined]="true">
        @if (pdfLoading()) {
          <i pButtonIcon class="pi pi-spin pi-spinner" aria-hidden="true"></i>
        } @else {
          <i pButtonIcon class="pi pi-download" aria-hidden="true"></i>
        }
        <span pButtonLabel>{{ 'all.button.download' | translate }}</span>
      </button>
      @if (loggedIn()) {
        <button
          pButton
          type="button"
          iconOnly
          size="small"
          [outlined]="true"
          severity="secondary"
          [attr.aria-label]="'all.button.save' | translate"
          (click)="saveMenu.toggle($event)"
        >
          <i pButtonIcon class="pi pi-chevron-down" aria-hidden="true"></i>
        </button>
        <p-menu #saveMenu [model]="saveMenuItems()" [popup]="true" />
      }
    </div>
  </div>
</p-card>

<section class="assembly-section">
  <app-assembly [formGroup]="dataService.formGroup" (validationOverview)="templateUpdated($event)" />
</section>

<p-dialog
  [header]="'all.v1.teamFormation.title' | translate"
  [closeAriaLabel]="'all.button.cancel' | translate"
  [visible]="showValidationDialog()"
  [modal]="true"
  [closable]="true"
  styleClass="w-full max-w-xl m-4"
  (onHide)="onDialogCancel()"
>
  @if (validationOverview()?.template) {
    <ng-container *ngTemplateOutlet="validationOverview()!.template" />
  }
  <ng-template #footer>
    <div class="flex flex-wrap justify-end gap-2">
      <button type="button" pButton severity="secondary" [outlined]="true" (click)="onDialogCancel()">
        {{ 'all.button.cancel' | translate }}
      </button>
      <button type="button" pButton (click)="onDialogConfirm()">{{ 'all.button.agree' | translate }}</button>
    </div>
  </ng-template>
</p-dialog>

<p-toast />
