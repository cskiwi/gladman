<p-card [header]="'all.player.detail.currentForm.title' | translate">
  @if (results().length) {
    <app-form-sequence [results]="results()" />
    <p class="mt-3 text-sm text-muted-color">
      {{ 'all.player.detail.currentForm.summary' | translate: { wins: wins(), losses: losses(), count: results().length } }}
    </p>
  } @else if (loading()) {
    <p-progressbar mode="indeterminate" />
  } @else {
    <p class="text-muted-color">{{ 'all.player.noRecentGames' | translate }}</p>
  }
</p-card>
