<p-card [header]="'all.player.detail.matchups.title' | translate">
  @if (opponents().length) {
    <ul class="m-0 flex list-none flex-col gap-3 p-0">
      @for (opp of opponents(); track opp.playerId) {
        <li class="flex items-center justify-between gap-3">
          <span class="flex min-w-0 items-center gap-2">
            <span class="truncate">{{ opp.fullName }}</span>
            @if (opp.level !== null && opp.level !== undefined) {
              <app-tier-badge [level]="opp.level" size="sm" />
            }
          </span>
          <p-tag severity="danger" [value]="opp.wins + '–' + opp.losses" />
        </li>
      }
    </ul>
  } @else if (loading()) {
    <p-progressbar mode="indeterminate" />
  } @else {
    <p class="text-muted-color">{{ 'all.player.detail.matchups.empty' | translate }}</p>
  }
</p-card>
