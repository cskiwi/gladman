<p-card [header]="'all.player.detail.teams.title' | translate">
  @if (loading()) {
    <p-progressbar mode="indeterminate" />
  } @else if (memberships().length) {
    <ul class="m-0 flex list-none flex-col gap-3 p-0">
      @for (tpm of memberships(); track tpm.id) {
        @if (tpm.team; as team) {
          <li class="flex items-center gap-3">
            <p-avatar [label]="abbreviation(team)" shape="circle" />
            <div class="flex min-w-0 flex-1 flex-col">
              <a
                class="truncate font-semibold text-color no-underline hover:underline"
                [routerLink]="team.club?.slug ? ['/', 'clubs', team.club!.slug, 'teams', team.slug] : null"
              >
                {{ team.name }}
              </a>
              <span class="truncate text-sm text-muted-color">{{ team.club?.name }}</span>
            </div>
            <p-tag
              [severity]="tpm.membershipType === 'REGULAR' ? 'info' : 'secondary'"
              [value]="'all.team.membership.' + tpm.membershipType + '.label' | translate"
            />
          </li>
        }
      }
    </ul>
  } @else {
    <p class="text-muted-color">{{ 'all.player.detail.teams.empty' | translate }}</p>
  }
</p-card>
