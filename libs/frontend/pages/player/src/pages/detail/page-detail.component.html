@if (!loading()) {
  @if (this.player(); as player) {
    <!-- Breadcrumb -->
    <app-breadcrumb [items]="[{ label: player.fullName }]" />

    <!-- Hero -->
    <app-hero>
      <!-- Avatar -->
      <app-hero-avatar avatar>{{ playerInitials() }}</app-hero-avatar>

      <!-- Identity -->
      <div identity>
        <app-hero-title>{{ player.fullName }}</app-hero-title>
        <div class="flex items-center gap-3 flex-wrap text-sm text-muted-color">
          @if (this.club(); as club) {
            <a class="inline-flex items-center gap-1.5 text-muted-color no-underline" [routerLink]="['/', 'clubs', club.slug]">
              <i class="pi pi-shield text-primary text-xs" aria-hidden="true"></i>
              <strong class="text-color font-semibold">{{ club.name }}</strong>
            </a>
          }
          @if (player.memberId) {
            <p-tag severity="secondary" [value]="'#' + player.memberId" />
          }
        </div>
      </div>

      <!-- Actions -->
      <div actions class="flex items-center gap-2 flex-wrap justify-end">
        <button pButton type="button" [outlined]="true" size="small" (click)="toggleFollow()">
          <i pButtonIcon class="pi pi-user-plus" aria-hidden="true"></i>
          <span pButtonLabel>{{ 'all.player.detail.follow' | translate }}</span>
        </button>
        <button pButton type="button" [routerLink]="['head-to-head']" size="small">
          <i pButtonIcon class="pi pi-users" aria-hidden="true"></i>
          <span pButtonLabel>{{ 'all.head-to-head.title' | translate }}</span>
        </button>
        <p-menu #menu [model]="editMenuItems()" [popup]="true" />
        <button
          pButton
          type="button"
          iconOnly
          [outlined]="true"
          [attr.aria-label]="'all.common.actions' | translate"
          [title]="'all.common.actions' | translate"
          (click)="menu.toggle($event)"
          size="small"
        >
          <i pButtonIcon class="pi pi-ellipsis-v" aria-hidden="true"></i>
        </button>
      </div>

      <!-- Rank panel -->
      <div stats class="mt-5 pt-5 border-t border-surface relative z-[1]">
        <app-player-ranking-progress [playerId]="player.id" />
      </div>
    </app-hero>

    <!-- Main grid: left content + right sidebar -->
    <div class="grid grid-cols-1 lg:grid-cols-[1fr_300px] gap-5 items-start">
      <!-- Left column -->
      <div class="flex flex-col gap-6">
        <!-- Upcoming -->
        <section>
          <app-upcoming-games [for]="player.id" [type]="'player'" />
        </section>

        <!-- Recent matches -->
        <section>
          <app-recent-games [for]="player.id" [type]="'player'" />
        </section>
      </div>

      <!-- Right sidebar -->
      <aside class="flex flex-col gap-5">
        <app-player-current-form [playerId]="player.id" />
        <app-player-season-record [playerId]="player.id" />
        <app-player-strongest-matchups [playerId]="player.id" />
        <app-player-teams [playerId]="player.id" />
      </aside>
    </div>
  }
} @else {
  <p-progressbar mode="indeterminate" class="h-1" />
}

@if (error()) {
  <p-message severity="error" icon="pi pi-exclamation-triangle" class="mt-4 w-full">
    {{ error() }}
  </p-message>
}
