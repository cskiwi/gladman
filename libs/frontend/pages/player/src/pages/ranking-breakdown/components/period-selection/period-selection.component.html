<div class="flex flex-wrap items-center gap-x-3 gap-y-1">
  <div class="flex flex-col gap-1">
    <span class="text-xs text-muted-color">{{ 'all.ranking.breakdown.period.title' | translate }}</span>
    <span class="font-medium text-color whitespace-nowrap">
      @if (start()) {
        {{ start() | dayjsFormat: 'DD MMM YYYY' }}
      }
      -
      @if (end()) {
        {{ end() | dayjsFormat: 'DD MMM YYYY' }}
      }
    </span>
  </div>

  <div class="flex items-center gap-1">
    <button
      #calendarTrigger
      pButton
      type="button"
      iconOnly
      [text]="true"
      severity="secondary"
      aria-haspopup="dialog"
      [attr.aria-expanded]="calendarVisible()"
      [attr.aria-controls]="calendarVisible() ? 'ranking-period-calendar' : null"
      [attr.aria-label]="'all.ranking.breakdown.period.choose-end-date' | translate"
      (click)="calendarVisible.set(true)"
    >
      <i pButtonIcon class="pi pi-calendar" aria-hidden="true"></i>
    </button>

    <p-dialog
      [(visible)]="calendarVisible"
      [header]="'all.ranking.breakdown.period.choose-end-date' | translate"
      [closeAriaLabel]="'all.button.close' | translate"
      [modal]="true"
      [draggable]="false"
      [resizable]="false"
      [pt]="{ root: { id: 'ranking-period-calendar' } }"
      styleClass="w-full max-w-sm m-2"
      appendTo="body"
      (onHide)="calendarTrigger.focus()"
    >
      <p-datepicker [inline]="true" [fluid]="true" [ngModel]="selectedDate()" (onSelect)="onDateSelect($event)" />
    </p-dialog>

    <button
      pButton
      type="button"
      iconOnly
      [text]="true"
      severity="secondary"
      aria-haspopup="menu"
      [attr.aria-label]="'all.ranking.breakdown.period.presets' | translate"
      (click)="quickMenu.toggle($event)"
    >
      <i pButtonIcon class="pi pi-ellipsis-v" aria-hidden="true"></i>
    </button>

    <p-menu
      #quickMenu
      [popup]="true"
      [ariaLabel]="'all.ranking.breakdown.period.presets' | translate"
      [model]="[
        { label: 'all.ranking.breakdown.period.last-point-update' | translate, command: lastPointUpdate.bind(this) },
        { label: 'all.ranking.breakdown.period.last-ranking-update' | translate, command: lastRankingUpdate.bind(this) },
        { separator: true },
        { label: 'all.ranking.breakdown.period.next-point-update' | translate, command: nextPointUpdate.bind(this) },
        { label: 'all.ranking.breakdown.period.next-ranking-update' | translate, command: nextRankingUpdate.bind(this) },
      ]"
      appendTo="body"
    />
  </div>
</div>
