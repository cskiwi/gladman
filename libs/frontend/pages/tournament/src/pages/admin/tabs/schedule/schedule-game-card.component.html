<div class="flex items-start gap-2">
  <i class="pi pi-arrows-alt text-muted-color" aria-hidden="true"></i>
  <div class="flex flex-col gap-1 min-w-0">
    <span class="text-sm font-medium text-color">{{ gameName() }}</span>
    @if (drawName()) {
      <span class="text-xs text-muted-color">{{ drawName() }}</span>
    }
    @if (round()) {
      <div><p-tag [value]="round()!" severity="secondary" [rounded]="true" /></div>
    }
  </div>
</div>
