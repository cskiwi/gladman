<p-panel [header]="'all.tournament.admin.settings.general' | translate">
  <form [formGroup]="settingsForm" (ngSubmit)="saveSettings()" class="flex flex-col gap-6">
    <p class="text-muted-color m-0">{{ 'all.tournament.admin.settings.generalDescription' | translate }}</p>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="flex flex-col gap-2 lg:col-span-2">
        <label for="name">{{ 'all.tournament.admin.settings.name' | translate }} *</label>
        <input
          pInputText
          id="name"
          formControlName="name"
          required
          fluid
          [placeholder]="'all.tournament.admin.settings.namePlaceholder' | translate"
        />
      </div>

      <div class="flex flex-col gap-2">
        <label for="tournamentDates">{{ 'all.tournament.admin.settings.tournamentDates' | translate }}</label>
        @defer {
          <p-datepicker
            inputId="tournamentDates"
            formControlName="tournamentDates"
            [showIcon]="true"
            dateFormat="dd/mm/yy"
            selectionMode="range"
            [readonlyInput]="true"
            fluid
            [placeholder]="'all.tournament.admin.settings.tournamentDatesPlaceholder' | translate"
          />
        }
        <small class="text-muted-color">{{ 'all.tournament.admin.settings.tournamentDatesHelp' | translate }}</small>
      </div>

      <div class="flex flex-col gap-2">
        <label for="enrollmentDates">{{ 'all.tournament.admin.settings.enrollmentDates' | translate }}</label>
        @defer {
          <p-datepicker
            inputId="enrollmentDates"
            formControlName="enrollmentDates"
            [showIcon]="true"
            dateFormat="dd/mm/yy"
            selectionMode="range"
            [readonlyInput]="true"
            fluid
            [placeholder]="'all.tournament.admin.settings.enrollmentDatesPlaceholder' | translate"
          />
        }
        <small class="text-muted-color">{{ 'all.tournament.admin.settings.enrollmentDatesHelp' | translate }}</small>
      </div>
    </div>

    <fieldset class="border-0 p-0 m-0 flex flex-col gap-3">
      <legend class="font-semibold mb-3">{{ 'all.tournament.admin.settings.options' | translate }}</legend>
      <div class="flex flex-wrap gap-x-6 gap-y-3">
        <div class="flex items-center gap-2">
          <p-checkbox formControlName="official" [binary]="true" inputId="official" />
          <label for="official">{{ 'all.tournament.admin.settings.official' | translate }}</label>
        </div>
        <div class="flex items-center gap-2">
          <p-checkbox formControlName="allowGuestEnrollments" [binary]="true" inputId="allowGuestEnrollments" />
          <label for="allowGuestEnrollments">{{ 'all.tournament.admin.settings.guestEnrollment' | translate }}</label>
        </div>
        <div class="flex items-center gap-2">
          <p-checkbox formControlName="schedulePublished" [binary]="true" inputId="schedulePublished" />
          <label for="schedulePublished">{{ 'all.tournament.admin.enrollments.schedulePublished' | translate }}</label>
        </div>
      </div>
    </fieldset>

    <div class="flex justify-end">
      <button pButton type="submit" [disabled]="settingsForm.invalid || updating()">
        @if (updating()) {
          <i pButtonIcon class="pi pi-spin pi-spinner" aria-hidden="true"></i>
        } @else {
          <i pButtonIcon class="pi pi-save" aria-hidden="true"></i>
        }
        <span pButtonLabel>{{ 'all.button.save' | translate }}</span>
      </button>
    </div>
  </form>
</p-panel>
