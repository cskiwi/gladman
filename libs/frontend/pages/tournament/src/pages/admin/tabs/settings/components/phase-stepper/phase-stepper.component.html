<p-panel [header]="'all.tournament.admin.settings.phase' | translate">
  <p class="text-muted-color mt-0 mb-4">{{ 'all.tournament.admin.settings.phaseDescription' | translate }}</p>

  <p-stepper class="hidden lg:block" [value]="currentPhaseIndex() + 1" [linear]="true">
    <p-step-list>
      @for (step of phaseSteps; track step.phase; let i = $index) {
        <p-step [value]="i + 1">
          <ng-template #content>
            <span
              class="inline-flex flex-col items-center gap-2"
              [pTooltip]="step.description | translate"
              tooltipPosition="bottom"
              [attr.aria-current]="i === currentPhaseIndex() ? 'step' : null"
            >
              <span
                class="rounded-full size-10 inline-flex items-center justify-center"
                [class]="i <= currentPhaseIndex() ? 'bg-primary text-primary-contrast' : 'border border-surface text-muted-color'"
              >
                <i [class]="step.icon"></i>
              </span>
              <span class="text-sm text-center" [class.font-semibold]="i === currentPhaseIndex()">
                {{ step.label | translate }}
              </span>
            </span>
          </ng-template>
        </p-step>
      }
    </p-step-list>
  </p-stepper>

  @if (currentStep(); as current) {
    <div class="lg:hidden"><p-progressbar [value]="progress()" [showValue]="false" [attr.aria-label]="current.label | translate" /></div>
    <div class="flex flex-col items-center gap-2 text-center mt-4">
      <span class="rounded-full size-10 inline-flex items-center justify-center bg-primary text-primary-contrast lg:hidden">
        <i [class]="current.icon"></i>
      </span>
      <p class="font-semibold m-0">{{ current.label | translate }}</p>
      <p class="text-muted-color m-0">{{ current.description | translate }}</p>
    </div>
  }

  <div class="flex flex-wrap gap-3 justify-center mt-4">
    <button pButton type="button" severity="secondary" [outlined]="true" [disabled]="!canGoBack() || updating()" (click)="goBackPhase()">
      <i pButtonIcon class="pi pi-arrow-left" aria-hidden="true"></i>
      <span pButtonLabel>{{ 'all.tournament.admin.settings.previousPhase' | translate }}</span>
    </button>
    <button pButton type="button" [disabled]="!canAdvance() || updating()" (click)="advancePhase()">
      <span pButtonLabel>{{ 'all.tournament.admin.settings.nextPhase' | translate }}</span>
      @if (updating()) {
        <i pButtonIcon class="pi pi-spin pi-spinner" aria-hidden="true"></i>
      } @else {
        <i pButtonIcon class="pi pi-arrow-right" aria-hidden="true"></i>
      }
    </button>
  </div>
</p-panel>
