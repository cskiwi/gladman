<p-confirmdialog />
<div class="flex flex-col gap-6">
  @if (updateError()) {
    <p-message severity="error">{{ updateError()! }}</p-message>
  }

  <!-- Phase Stepper -->
  <app-phase-stepper
    [tournament]="tournament()"
    [updating]="updating()"
    (advancePhaseRequested)="handleAdvancePhase()"
    (goBackPhaseRequested)="handleGoBackPhase()"
  />

  <!-- General Settings -->
  <app-general-settings [tournament]="tournament()" [updating]="updating()" (saveSettingsRequested)="handleSaveSettings($event)" />

  <!-- Sub-Events -->
  <app-sub-events
    [tournament]="tournament()"
    [updating]="updating()"
    (createSubEventRequested)="handleCreateSubEvent($event)"
    (updateSubEventRequested)="handleUpdateSubEvent($event)"
    (deleteSubEventRequested)="handleDeleteSubEvent($event)"
  />
</div>
